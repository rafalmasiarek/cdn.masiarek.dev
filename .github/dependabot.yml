# Added from shared-config: templates/.github/dependabot.yml.tpl
version: 2
updates:
# Added from shared-config: files/js/.github/dependabot.yml.tpl
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "eslint"
        versions: ["5.x"]
    allow:
      - dependency-type: "direct"
